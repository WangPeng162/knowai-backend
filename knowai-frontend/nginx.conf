# ============================================================
# Nginx 配置：静态托管前端 + 反向代理后端
#  开发态由 Vite 代理 /api → localhost:8080（见 vite.config.js）
#  生产态由本配置完成同一件事：/api/xxx → http://backend:8080/xxx
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源 + SPA 路由回退（刷新任意前端路由都能命中 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到后端容器
    # 注意 proxy_pass 末尾的 "/"：会把请求路径中的 /api/ 前缀替换掉
    #   /api/chat  →  http://backend:8080/chat
    location /api/ {
        proxy_pass http://backend:8080/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # RAG 问答涉及多次模型调用，耗时较长，放宽超时
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;

        # 上传文档可能较大
        client_max_body_size 50m;
    }
}
