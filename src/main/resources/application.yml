spring:
  autoconfigure:
    exclude: org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  application:
    name: knowai-backend
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/knowai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.knowai.knowaibackend.entity

# 日志
logging:
  level:
    com.knowai.knowaibackend: debug
    root: info

# Swagger/OpenAPI
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true



